version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: arn-postgres
    environment:
      POSTGRES_USER: arn
      POSTGRES_PASSWORD: arn_dev_password
      POSTGRES_DB: agent_research_network
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arn"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: arn-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arn_minio
      MINIO_ROOT_PASSWORD: arn_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  minio-data:
