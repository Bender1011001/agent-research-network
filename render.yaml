services:
  - type: web
    name: agent-research-network
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerTarget: all-in-one
    plan: starter
    region: oregon
    branch: main
    
    healthCheckPath: /health
    
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: HOST
        value: 0.0.0.0
      - key: RUN_MIGRATIONS
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: arn-postgres
          property: connectionString
      - key: WEB_URL
        value: https://agent-research-network.onrender.com
      - key: API_URL
        value: https://agent-research-network.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOW_DEMO_SEED
        value: false
    
    autoDeploy: true

databases:
  - name: arn-postgres
    databaseName: agent_research_network
    plan: starter
    region: oregon
    
    ipAllowList: []
